name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # One job per target, so a Linux binary ships alongside the Apple Silicon one.
  # Previously the only prebuilt asset was aarch64-apple-darwin, which made
  # "ws is macOS only" true of the *release* even though the code is portable.
  #
  # Linux uses the `-musl` target so the artifact is statically linked and does
  # not inherit the runner's glibc as a version floor — a gnu build made on
  # ubuntu-24.04 refuses to start on an older distro, which is exactly the
  # failure a prebuilt binary exists to avoid.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install musl tooling and tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools tmux

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="ws-v${version}-${{ matrix.target }}.tar.gz"
          mkdir -p package
          cp "target/${{ matrix.target }}/release/ws" package/ws
          cp README.md LICENSE package/
          tar -C package -czf "$asset" ws README.md LICENSE
          # One checksum file per target; the release job concatenates them into a
          # single SHA256SUMS. `sha256sum` on Linux, `shasum` on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ws-${{ matrix.target }}
          path: |
            ws-*.tar.gz
            ws-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Assemble SHA256SUMS
        shell: bash
        run: |
          cd dist
          # Sorted so the file is byte-stable across re-runs.
          cat $(ls ws-*.tar.gz.sha256 | sort) > SHA256SUMS
          rm -f ws-*.tar.gz.sha256
          cat SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ws-*.tar.gz dist/SHA256SUMS install.sh \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
