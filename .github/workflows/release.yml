name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Build Apple Silicon binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="ws-v${version}-aarch64-apple-darwin.tar.gz"
          mkdir -p package
          cp target/aarch64-apple-darwin/release/ws package/ws
          cp README.md LICENSE package/
          tar -C package -czf "$asset" ws README.md LICENSE
          shasum -a 256 "$asset" > SHA256SUMS
          printf 'ASSET=%s\n' "$asset" >> "$GITHUB_ENV"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ASSET" SHA256SUMS install.sh \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
