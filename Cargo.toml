[package]
name = "ws"
version = "0.8.0"
edition = "2021"
description = "Persistent workspaces shared by Claude Code and Codex"
license = "MIT"
readme = "README.md"
repository = "https://github.com/djock/agent-workspaces"

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
fs2 = "0.4.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
# Every platform credential store in keyring 3 sits behind a feature flag, and
# with none enabled the crate silently falls back to a *mock in-memory* store:
# `set_password` succeeds, the process exits, and the value is gone. That is not
# a hypothetical — it shipped. `-secrets set` printed "stored NAME", the on-disk
# name index kept the name so `-secrets list` still showed it, and `-secrets get`
# in the next process returned NoEntry ("no such secret"). Nothing ever reached
# the OS vault. Keep a real store enabled for every target we build for; the
# `cfg` guard at the top of `src/secrets.rs` fails the build if one is missing.
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
rpassword = "7"
grep = "0.4.1"
ignore = "0.4.31"
regex = "1.13.1"
# Raw mode and key events for the console list (`src/picker.rs`). `ratatui` used
# to sit on top of this for a full-screen dashboard; the picker draws inline with
# plain ANSI, so only the terminal-input half is still needed.
crossterm = "0.29.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Linux/BSD: the Secret Service over D-Bus, reached with the *async* backend
# (zbus) plus `crypto-rust`, which is pure Rust end to end. The obvious-looking
# `sync-secret-service` instead pulls `dbus-secret-service` -> `libdbus-sys`,
# which needs the system `libdbus-1-dev` at build time — it broke the
# x86_64-unknown-linux-musl release build ("Package 'dbus-1' ... not found"),
# and linking a system C library into what is meant to be a static musl binary
# would be the wrong fix even where the package exists. `async-io` supplies the
# runtime keyring blocks on internally; nothing here becomes async.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios"))))'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "async-io"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
