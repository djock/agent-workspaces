[package]
name = "ws"
version = "0.3.0"
edition = "2021"
description = "Persistent workspaces shared by Claude Code and Codex"
license = "MIT"
readme = "README.md"
repository = "https://github.com/djock/agent-workspaces"

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
fs2 = "0.4.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
keyring = "3"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
rpassword = "7"
grep = "0.4.1"
ignore = "0.4.31"
regex = "1.13.1"
# Raw mode and key events for the console list (`src/picker.rs`). `ratatui` used
# to sit on top of this for a full-screen dashboard; the picker draws inline with
# plain ANSI, so only the terminal-input half is still needed.
crossterm = "0.29.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
